apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: {{ .Values.tlsSecret }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.grafana.service }}
                port:
                  number: {{ .Values.grafana.port }}
          - path: {{ .Values.prometheus.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.prometheus.service }}
                port:
                  number: {{ .Values.prometheus.port }}
          - path: {{ .Values.alertmanager.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.alertmanager.service }}
                port:
                  number: {{ .Values.alertmanager.port }}