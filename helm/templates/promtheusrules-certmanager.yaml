apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: {{ .Values.namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cert-manager.rules
      rules:
        - alert: CertManagerCertExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) / 60 < 90
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Le certificat {{`{{ $labels.name }}`}} expire bientôt"
            description: "Le certificat {{`{{ $labels.name }}`}} (namespace {{`{{ $labels.exported_namespace }}`}}) expire dans moins de 90 minutes."

        - alert: CertManagerCertExpired
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Le certificat {{`{{ $labels.name }}`}} a expiré"
            description: "Le certificat {{`{{ $labels.name }}`}} (namespace {{`{{ $labels.exported_namespace }}`}}) est expiré."

        - alert: CertManagerCertNotReady
          expr: |
            certmanager_certificate_ready_status{condition="True"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Le certificat {{`{{ $labels.name }}`}} n'est pas prêt"
            description: "Le certificat {{`{{ $labels.name }}`}} (namespace {{`{{ $labels.exported_namespace }}`}}) n'est pas dans l'état Ready depuis plus de 10 minutes."