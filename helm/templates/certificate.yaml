apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-cert
  namespace: {{ .Values.namespace }}
spec:
  secretName: {{ .Values.tlsSecret }}
  duration: 1h05m
  renewBefore: 1h
  dnsNames:
    - {{ .Values.domain }}
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
